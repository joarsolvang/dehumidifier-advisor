name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install project
        run: |
          uv sync --frozen

      - name: Lint
        run: |
          uv run poe lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install project
        run: |
          uv sync --frozen

      - name: Test
        run: |
          uv run poe test

  all:
    name: All Checks Passed
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: All checks passed
        run: echo "✅ All Checks Passed"

  deploy:
    name: Deploy to Azure Container Apps
    needs: [all]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name acrtork

      - name: Build and push image
        run: |
          docker build \
            -t acrtork.azurecr.io/tork/streamlit:${{ github.sha }} \
            -t acrtork.azurecr.io/tork/streamlit:latest \
            .
          docker push acrtork.azurecr.io/tork/streamlit:${{ github.sha }}
          docker push acrtork.azurecr.io/tork/streamlit:latest

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ca-tork-streamlit \
            --resource-group rg-tork-prod \
            --image acrtork.azurecr.io/tork/streamlit:${{ github.sha }}
